name: apply-bot-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bot-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify patch integrity
        run: |
          echo "4e84cbe1d43b3620231aefc8681de6a053285345d7e3ebe502a157d069425a92  bot-fix.patch" | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check bot-fix.patch
          git apply bot-fix.patch
      - name: Verify applied blobs
        run: |
          test "$(git hash-object server.ts)" = "b439a60ac6a4713307e9885b84cf070016b50d05"
          test "$(git hash-object src/server/serverBot.ts)" = "555356083ec4ce09d12ee47c91f94c1ab6dd11ee"
          test "$(git hash-object tests/botStuckStates.test.mjs)" = "1397155bf21d605eb8eba6ae1f2a4f1389673ebe"
          echo "blobs match the verified tree"
      - name: Commit and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f bot-fix.patch .github/workflows/apply-bot-fix.yml
          git add -A
          git commit -m "Fix bots freezing in TRENCH/RETREAT; allow proxied preview host"
          git push
