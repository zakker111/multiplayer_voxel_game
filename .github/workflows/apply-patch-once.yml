name: Apply one-off server fixes

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply-server-fixes.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and push
        run: |
          set -euo pipefail
          patch_file='patches/apply-server-fixes.patch'
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -f "$patch_file"
          rm -f .github/workflows/apply-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply verified server fixes: flag carrier lifecycle, admin auth, hit confirmation'
          git push
