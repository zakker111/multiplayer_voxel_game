name: Apply verified Phase A patch

on:
  push:
    branches: [buff/phase-a-src]
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply, verify, push
        id: run
        continue-on-error: true
        run: |
          exec > >(tee -a /tmp/apply.log) 2>&1
          set -euo pipefail
          echo "== fetch patch =="
          curl -fsSL --retry 2 --max-time 60 "https://paste.c-net.org/InspireDorothy" -o /tmp/phase-a.patch
          echo "68e25cfc91c9692849bedfeff2d449ec356ddc62e37f3fe735de046d9871256b  /tmp/phase-a.patch" | sha256sum -c -
          echo "== apply =="
          git apply --check /tmp/phase-a.patch
          git apply --whitespace=nowarn /tmp/phase-a.patch
          git status --short
          echo "== install =="
          npm ci
          echo "== typecheck =="
          npm run lint
          echo "== build =="
          npm run build
          echo "== test =="
          npm test
          echo "== commit =="
          git config user.name "zakker111"
          git config user.email "2182664+zakker111@users.noreply.github.com"
          git add -A
          git commit -F - <<'MSG'
          Finish Phase A, fix bot objective commit, refresh docs, drop dead files

          Rounds, spawn shields, regeneration and the killfeed/damage-direction/ping
          layer are all server-authoritative and covered by tests. Bots no longer
          abandon a flag run for a distant contact, and client payloads are shape-
          checked at the protocol boundary instead of throwing in the raycast/build
          handlers. Docs now match the code (arena numbers, protocol, scripts, test
          count) and the Pages workflow publishes only the client bundle.

          Generated with Codebuff 🤖
          Co-Authored-By: Codebuff <noreply@codebuff.com>
          MSG
          echo "TREE=$(git rev-parse HEAD^{tree})"
          git push --force origin HEAD:refs/heads/buff/phase-a-applied
          git push origin HEAD:main
          echo "== done =="

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "outcome: ${{ steps.run.outcome }}"
            echo
            tail -c 15000 /tmp/apply.log 2>/dev/null || echo "(no apply log captured)"
          } > report.txt
          cd "$RUNNER_TEMP"
          rm -rf report-repo && mkdir report-repo && cd report-repo
          git init -q
          cp "$GITHUB_WORKSPACE/report.txt" report.txt
          git -c user.name=ci -c user.email=ci@local git add report.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "ci report"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/buff/ci-report
