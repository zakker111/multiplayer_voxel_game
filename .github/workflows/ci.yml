name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck and lint
        run: npm run lint

      - name: Compile and build production bundle
        run: npm run build

      - name: Run voxel gameplay tests
        run: npm test

  beta-probe:
    name: Beta protocol probe (PHASE=${{ matrix.phase }})
    runs-on: ubuntu-latest
    # Drives the real HTTP/SSE/WS protocol the browser uses. The economy phases
    # teleport on purpose (flag capture, workshop, jeep, builds) so they need a
    # botless server with MOVE_VALIDATION=off, and a freshly started one: flag,
    # round and build state persist between runs, so a dirty process fails later
    # checks. The bots phase is the exception: it observes a live roster instead.
    strategy:
      fail-fast: false
      matrix:
        # Online coverage of the Beta economy: core loop + vehicles/CTF, the
        # cannon/structures path, the Phase 4 emplacement rules (nest, crates,
        # team limit, dismantle refund), the forward supply crate, and the bot AI
        # building, crewing and driving by itself over the wire.
        include:
          - phase: all
            bots: 0
          - phase: structures
            bots: 0
          - phase: emplacements
            bots: 0
          - phase: support
            bots: 0
          - phase: bots
            bots: 10
    env:
      PROBE_PORT: '3121'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build production bundle
        run: npm run build

      - name: Start a fresh server
        run: |
          nohup env NODE_ENV=production PORT="$PROBE_PORT" SERVER_BOT_COUNT=${{ matrix.bots }} \
            MOVE_VALIDATION=off node dist/server.cjs > beta-probe-server.log 2>&1 &
          echo $! > beta-probe-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$PROBE_PORT/api/status" > /dev/null; then
              echo "server ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo '::error::server never answered /api/status'
          cat beta-probe-server.log
          exit 1

      - name: Run Beta probe
        run: BASE="http://127.0.0.1:$PROBE_PORT" PHASE=${{ matrix.phase }} node scripts/beta-probe.mjs

      - name: Server log and cleanup
        if: always()
        run: |
          cat beta-probe-server.log || true
          if [ -f beta-probe-server.pid ]; then kill "$(cat beta-probe-server.pid)" || true; fi
