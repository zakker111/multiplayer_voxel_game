name: sync-source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          (
            set -ex
            SHA=24ff99a9af6f0a8e3a7c363dc5e7a8ab07073409d5933a4c5f3d12114a77435f
            ok=0
            for u in https://paste.rs/xjShZ https://files.catbox.moe/1elhkm.b64; do
              rm -f /tmp/p.b64
              code=$(curl -sSL --max-time 90 -o /tmp/p.b64 -w '%{http_code}' "$u" || echo ERR)
              echo "fetch $u -> $code $(wc -c < /tmp/p.b64 2>/dev/null || echo 0)"
              if [ "$code" = 200 ] && echo "$SHA  /tmp/p.b64" | sha256sum -c -; then ok=1; break; fi
            done
            test "$ok" = 1
            base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
            git apply --check -v /tmp/p.patch
            git apply /tmp/p.patch
            npm ci
            npm run lint
            npm run build
            npm test
            git config user.name zakker111
            git config user.email 2182664+zakker111@users.noreply.github.com
            git add -A
            git commit -m "Aim mortars at the crosshair, preview shell impact, and make workshop hardware destroyable"
            set +x
            git push "https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/zakker111/multiplayer_voxel_game.git" HEAD:main
          ) > /tmp/sync.log 2>&1
          status=$?
          echo "sync-exit=$status" >> /tmp/sync.log
          sed -i 's/x-access-token:[^@]*@/x-access-token:***@/g' /tmp/sync.log
          echo "=== sync log tail (status $status) ==="
          tail -20 /tmp/sync.log
          exit $status
      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name diag
          git config user.email diag@example.com
          git checkout -B diag origin/main
          cp /tmp/sync.log sync-diag.txt 2>/dev/null
          sed -i 's/x-access-token:[^@]*@/x-access-token:***@/g' sync-diag.txt 2>/dev/null
          git add -f sync-diag.txt
          git commit -m "sync diagnostics" -- sync-diag.txt
          set +x
          git push --force "https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/zakker111/multiplayer_voxel_game.git" HEAD:diag
