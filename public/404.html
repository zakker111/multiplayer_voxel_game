<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel FPS - Redirecting</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects 404 paths back to index.html while preserving query parameters and path
      sessionStorage.redirect = location.href;
      var pathSegmentsToKeep = 1; // 1 for repo subdirectory (e.g. /voxel-fps/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Voxel FPS...</p>
  </body>
</html>
