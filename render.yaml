# Render Blueprint — one-click always-on Voxel FPS server (DEPLOYMENT.md Option 1)
#
# In the Render dashboard: New + → Blueprint → pick this repo → Deploy Blueprint.
# Render reads this file, builds the client + server, and serves HTTP + WebSocket
# from one process on its injected $PORT. No manual field-filling needed.
services:
  - type: web
    name: voxel-fps-ctf
    runtime: node
    # The app lives at the repo root of this repo, so no `rootDir` is needed and
    # the Blueprint wizard finds this file by default. If the code is ever moved
    # into a subdirectory (e.g. voxel/), add `rootDir: voxel` here and leave this
    # file at the repo root. Only if this file moves too does the wizard need its
    # Blueprint Path set to `voxel/render.yaml`.
    #
    # Starter: 0.5 CPU / 512 MB, $7/mo. Memory is no longer the constraint: a
    # 20-bot server measures ~115 MB RSS (~2.1 ms per tick, so ~0.04 core at
    # 20 Hz, more with humans and shells). Free (0.1 CPU) leaves too little
    # headroom and still spins down, hence Starter.
    plan: 0.5c-512mb
    region: oregon
    branch: main
    # `autoDeploy` is deprecated; this is its documented replacement.
    autoDeployTrigger: commit
    # --include=dev is required: Vite/esbuild are devDependencies, and NODE_ENV
    # is production here, so a plain `npm ci` would skip the build toolchain.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      # Keep the match 10v10 with server-owned bots, as in DEPLOYMENT.md.
      - key: SERVER_BOT_COUNT
        value: "10"
      - key: ROUND_MINUTES
        value: "30"
      # The server sits behind Render's proxy, so client identity must come from
      # X-Forwarded-For for per-IP caps and IP bans to work.
      - key: TRUST_PROXY
        value: "1"
      # Secret: never stored here. Render prompts for it once during Blueprint
      # creation; leave it blank to keep the admin API localhost-only.
      - key: ADMIN_TOKEN
        sync: false
